# Build na raiz (requirements.txt aponta para agents/); arranque dentro de agents/.
# Assim o deploy funciona mesmo sem "Root Directory" no painel.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: funcio-agno
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Sem `cd agents` o Render corre em /src e falha: run.py está em agents/run.py
    startCommand: cd agents && AGNO_HOST=0.0.0.0 AGNO_PORT=$PORT python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
