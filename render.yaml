# Render Blueprint — Root Directory = agents (ver Settings no serviço ou usar este ficheiro).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: funcio-agno
    runtime: python
    rootDir: agents
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
