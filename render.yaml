# Build na raiz (requirements.txt aponta para agents/); arranque dentro de agents/.
# Assim o deploy funciona mesmo sem "Root Directory" no painel.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: funcio-agno
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd agents && python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
