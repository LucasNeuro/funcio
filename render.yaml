# Build na raiz (requirements.txt aponta para agents/); arranque dentro de agents/.
# Assim o deploy funciona mesmo sem "Root Directory" no painel.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: funcio-agno
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Raiz tem run.py que faz chdir para agents/ (compatível com painel que só corre ``python run.py``).
    startCommand: AGNO_HOST=0.0.0.0 AGNO_PORT=$PORT python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
