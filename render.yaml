# Render Blueprint — código na raiz do repo (requirements.txt + run.py).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: funcio-agno
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: AGNO_HOST=0.0.0.0 AGNO_PORT=$PORT python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
